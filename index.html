<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>טיול זוגי מרקוביץ בפראג - סיכום</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome 6.4.0 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* פלטת גגות פראג משודרגת */
            --primary-orange: #C85A17; 
            --secondary-orange: #E27D3E; 
            --primary-brown: #4A3B32; 
            --secondary-brown: #66544A; 
            --accent-green: #457B5E; 
            --bg-color: #FAF6F0; 
            --card-bg: #ffffff;
            --text-dark: #4A3B32; 
            --text-gray: #7f8c8d;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Assistant', sans-serif;
            color: var(--text-dark);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 80vh; /* כדי לפזר יפה את התוכן על המסך */
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid var(--primary-orange);
            object-fit: cover;
            margin: 0 auto 15px auto;
            display: block;
        }

        h1 {
            color: var(--primary-brown);
            background-color: transparent !important;
            margin: 0 0 5px 0;
            font-size: 1.8rem;
            font-weight: 800;
        }

        h2.subtitle {
            color: var(--accent-green);
            background-color: transparent !important;
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* Main Content - Post Trip */
        .post-trip-content {
            text-align: center;
            flex-grow: 1; /* דוחף את הפוטר למטה */
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px 0;
        }

        .thank-you-message {
            color: var(--primary-orange);
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 30px;
        }

        .feedback-box {
            background: #FDFBF8;
            padding: 25px 20px;
            border-radius: 12px;
            border: 1px solid var(--secondary-orange);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .feedback-title {
            color: var(--primary-brown);
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-family: inherit;
            font-size: 1rem;
            resize: vertical;
            margin-bottom: 20px;
            color: var(--text-dark);
            background-color: #fff;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-orange);
            box-shadow: 0 0 5px rgba(200, 90, 23, 0.2);
        }

        .whatsapp-btn {
            background-color: #25D366; /* הצבע הרשמי של וואטסאפ */
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: background 0.3s, transform 0.2s;
            width: 100%;
            justify-content: center;
            box-sizing: border-box;
        }

        .whatsapp-btn:hover {
            background-color: #1ebe57;
            transform: translateY(-2px);
        }

        .whatsapp-btn:active {
            transform: translateY(0);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid var(--primary-orange);
        }

        .footer-line1 {
            color: var(--accent-green);
            font-size: 1.15rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .footer-line2 {
            color: var(--secondary-brown);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="1.jpg" alt="Logo" class="logo">
        <h1>טיול זוגי מרקוביץ בפראג</h1>
        <h2 class="subtitle">ג'-ה' אלול תשפ"ו</h2>
    </header>

    <div class="post-trip-content">
        <div class="thank-you-message">
            איזה כיף שנהניתם!<br>נתראה בטיול הבא,<br>הדס
        </div>

        <div class="feedback-box">
            <h3 class="feedback-title"><i class="fas fa-comment-dots" style="color: var(--accent-green);"></i> נשמח לשמוע איך היה!</h3>
            <textarea id="feedbackText" rows="5" placeholder="ספרו קצת על החוויות, האתרים שהכי אהבתם, המסעדות..."></textarea>
            <button onclick="sendToWhatsApp()" class="whatsapp-btn">
                <i class="fab fa-whatsapp" style="font-size: 1.4rem;"></i> שליחת חוות דעת לוואטסאפ
            </button>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="footer-line1">כל הזכויות שמורות להדס טרכטר - יועצת טיולים בארץ ובעולם 050-5685356</div>
        <div class="footer-line2">אין להעביר ללא אישור מפורש. העובר על כך עובר על גזל לפי דין תורה וחוקי המקום</div>
    </div>
</div>

<script>
    function sendToWhatsApp() {
        var feedback = document.getElementById('feedbackText').value;
        if (!feedback.trim()) {
            alert('אנא כתבו כמה מילים לפני השליחה :)');
            return;
        }
        
        // המספר שלך הומר לפורמט בינלאומי לקבלת הודעות בוואטסאפ (ללא הפלוס)
        var phoneNumber = '972505685356'; 
        
        // יצירת הודעה מובנית מראש שתשלח אלייך
        var messageText = "היי הדס, חזרנו מפראג! הנה חוות הדעת שלנו על הטיול:\n\n" + feedback;
        
        // קידוד הטקסט ל-URL תקין
        var encodedText = encodeURIComponent(messageText);
        
        // יצירת קישור לפתיחת וואטסאפ
        var whatsappUrl = 'https://wa.me/' + phoneNumber + '?text=' + encodedText;
        
        // פתיחה בחלון חדש
        window.open(whatsappUrl, '_blank');
    }
</script>

</body>
</html>
